<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>音楽科 週案帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
<style>
  :root{
    --ink:#26324A;
    --paper:#F7F4EC;
    --paper-dark:#EFEAE0;
    --line:#D8D0BE;
    --accent:#2B6E6E;
    --hanko:#B5453D;
    --muted:#8A8272;
    --muted2:#9A8F7A;
    --warn:#B5453D;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    padding-bottom:60px;
  }
  select, textarea, input, button{ font-family:'Zen Kaku Gothic New', sans-serif; }
  textarea{ resize:vertical; }
  ::placeholder{ color:var(--muted2); }
  button{ cursor:pointer; }

  .clamp2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  header{ padding:20px 20px 14px; border-bottom:1px solid var(--line); }
  .header-inner{ max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand h1{ font-family:'Shippori Mincho', serif; font-size:24px; font-weight:700; margin:0; letter-spacing:1px; }
  .brand .sub{ font-size:12px; color:#7A7263; margin-top:2px; }

  .save-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .save-status{ font-size:11.5px; color:var(--muted); }
  .save-status.dirty{ color:var(--warn); font-weight:700; }

  nav.tabs{ max-width:1100px; margin:16px auto 0; display:flex; gap:8px; flex-wrap:wrap; }
  .tab-btn{
    display:flex; align-items:center; gap:6px; padding:9px 18px;
    border-radius:10px 10px 0 0; border:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--paper-dark); color:#7A7263; font-weight:500; margin-bottom:-1px; font-size:14px;
  }
  .tab-btn.active{ background:#fff; color:var(--accent); font-weight:700; border-bottom:2px solid #fff; }

  main{ max-width:1100px; margin:0 auto; padding:24px 20px; display:flex; flex-direction:column; gap:20px; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  .section-title{ font-family:'Shippori Mincho', serif; font-size:17px; font-weight:700; margin:0 0 6px; }
  .hint{ font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.6; }

  .input{ border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; color:var(--ink); width:100%; }
  .select{ width:100%; border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:13px; color:var(--ink); background:#fff; }
  .textarea{ width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12.5px; color:var(--ink); line-height:1.5; }

  .btn{ display:inline-flex; align-items:center; gap:4px; border-radius:8px; padding:8px 16px; font-size:14px; font-weight:600; white-space:nowrap; border:none; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-outline{ background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn-muted{ background:#fff; color:var(--muted2); border:1px solid var(--line); }
  .nav-btn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff; display:inline-flex; align-items:center; justify-content:center; color:var(--ink); font-size:15px; }

  table.grid{ border-collapse:collapse; width:100%; }
  table.grid th{ border:1px solid var(--line); background:var(--paper-dark); padding:8px 6px; font-size:13px; font-weight:700; }
  table.grid td{ border:1px solid var(--line); padding:8px; }
  td.row-label{ text-align:center; font-weight:700; color:#7A7263; background:#fff; font-size:13px; }
  tr.break td{ background:var(--paper-dark); color:var(--muted2); text-align:center; font-size:12px; }

  .badge-circle{
    display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 3px;
    border-radius:50%; background:var(--accent); color:#fff; font-size:13px; font-weight:700;
  }
  .badge-circle.skip{ background:#E4DFD2; color:var(--muted2); }

  .obj-preview{ font-size:11px; background:var(--paper-dark); border:1px dashed var(--line); border-radius:6px; padding:5px 7px; min-height:30px; color:var(--muted2); }
  .obj-preview.has-text{ color:var(--ink); }

  .hanko-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; }
  .hanko-circle{
    width:46px; height:46px; border-radius:50%; border:2px solid var(--hanko); display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:15px; color:var(--hanko); background:transparent;
  }
  .hanko-circle.active{ background:var(--hanko); color:#fff; }
  .hanko-label{ font-size:11px; color:var(--ink); letter-spacing:1px; }

  .chip{ display:flex; align-items:center; gap:6px; background:var(--paper-dark); border:1px solid var(--line); border-radius:20px; padding:6px 6px 6px 14px; font-size:14px; }
  .chip button{ border:none; background:none; display:flex; color:var(--muted2); padding:2px; }

  .pill-btn{ padding:7px 16px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:500; font-size:13px; }
  .pill-btn.active{ border-color:var(--accent); background:var(--accent); color:#fff; font-weight:700; }

  .obj-row{ display:flex; align-items:flex-start; gap:12px; border:1px solid var(--line); border-radius:10px; padding:12px; background:#fff; }
  .obj-row.future{ background:var(--paper-dark); }
  .obj-num{ min-width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
  .obj-num.future{ background:#D8D0BE; }

  .staff-line{ display:block; }

  /* 印刷プレビュー（A4縦・1枚／様式に準拠） */
  .print-toolbar{ width:100%; max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .print-page{
    width:210mm; min-height:297mm; background:#fff; padding:10mm 9mm; box-sizing:border-box;
    box-shadow:0 0 14px rgba(0,0,0,0.15); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif; margin:0 auto;
  }
  .print-page table{ border-collapse:collapse; width:100%; table-layout:fixed; }
  .print-page th, .print-page td{ border:1px solid #666; }
  .print-th{ background:#F0EDE4; font-size:9.5px; padding:1.2mm 0.5mm; font-weight:700; text-align:center; }
  .print-period-cell{ padding:1mm 1.3mm; vertical-align:top; height:25mm; overflow:hidden; }
  .print-break-cell{ padding:0.6mm 1.3mm; vertical-align:middle; height:7mm; overflow:hidden; background:#FAFAF7; }
  .print-break-label{ font-size:7px; color:#777; font-weight:700; }
  .print-break-note{ font-size:8px; color:#333; }
  .print-row-label{ text-align:center; font-size:10px; font-weight:700; color:#555; vertical-align:middle !important; }
  .print-lesson-line1{ font-size:8.6px; font-weight:700; margin-bottom:0.6mm; }
  .print-lesson-line2{ font-size:8.4px; color:#333; margin-bottom:0.6mm; }
  .print-lesson-line3{ font-size:8.4px; }
  .print-badge{ display:inline-block; padding:0 1mm; border-radius:2mm; background:#eee; color:#555; font-size:7.5px; margin-left:2px; }
  .print-badge.skip{ background:#ccc; }
  .print-goal-box{ border:1px solid #666; border-radius:2px; padding:2mm; }
  .print-hanko-box{ width:15mm; height:15mm; border:1px solid #666; }

  @media print {
    html, body { background:#fff !important; margin:0 !important; padding:0 !important; }
    body * { visibility:hidden; }
    .print-page, .print-page * { visibility:visible !important; }
    .print-page {
      position:absolute !important; top:0 !important; left:0 !important;
      width:210mm !important; min-height:297mm !important; margin:0 !important; box-shadow:none !important;
      transform:none !important;
    }
    .print-page-wrapper{ width:auto !important; height:auto !important; overflow:visible !important; }
    @page { size:A4 portrait; margin:0; }
  }

  /* ---- モバイル用：日付タブで1日ずつ表示するレイアウト ---- */
  .day-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .day-tab-btn{ flex:1; min-width:52px; padding:8px 4px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:600; font-size:13px; }
  .day-tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .mobile-period-card{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fff; }
  .mobile-period-card.break-card{ background:var(--paper-dark); text-align:center; color:var(--muted2); font-size:13px; padding:8px; }
  .mobile-period-label{ font-size:12px; font-weight:700; color:#7A7263; margin-bottom:6px; }

  .print-page-wrapper{ overflow:hidden; margin:0 auto; }

  @media (max-width: 720px){
    header{ padding:14px 12px 10px; }
    .brand h1{ font-size:19px; }
    .brand .sub{ font-size:10px; }
    .save-bar{ width:100%; justify-content:space-between; }
    .save-status{ width:100%; order:3; }
    nav.tabs{ margin-top:12px; gap:5px; }
    .tab-btn{ padding:8px 10px; font-size:12.5px; flex:1 1 auto; justify-content:center; }
    main{ padding:14px 10px; gap:14px; }
    .card{ padding:13px; border-radius:10px; }
    .section-title{ font-size:15.5px; }
    .btn{ padding:8px 12px; font-size:13px; }
    table.grid{ min-width:0 !important; }
    .print-page{ box-shadow:none; }
    .two-col-responsive{ grid-template-columns:1fr !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file-input-fallback" accept="application/json" style="display:none" />

<script>
function isNarrow(){ return window.innerWidth < 720; }
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (typeof render === "function") render(); }, 200);
});
/* ============================================================
   定数
============================================================ */
const ALL_DAYS = [
  { key: "mon", label: "月" },
  { key: "tue", label: "火" },
  { key: "wed", label: "水" },
  { key: "thu", label: "木" },
  { key: "fri", label: "金" },
  { key: "sat", label: "土" },
];
function visibleDays(cfg) {
  return cfg?.showSaturday ? ALL_DAYS : ALL_DAYS.filter((d) => d.key !== "sat");
}
const PERIOD_NUMS = [1, 2, 3, 4, 5, 6, 7];
const ROWS = [
  { type: "period", num: 1 },
  { type: "period", num: 2 },
  { type: "period", num: 3 },
  { type: "break", label: "中休み" },
  { type: "period", num: 4 },
  { type: "period", num: 5 },
  { type: "break", label: "給食" },
  { type: "break", label: "昼休み" },
  { type: "period", num: 6 },
  { type: "period", num: 7 },
];
const PERSPECTIVES = [
  { key: "知", label: "知：知識" },
  { key: "技", label: "技：技能" },
  { key: "思", label: "思：思考・判断・表現" },
  { key: "主", label: "主：主体的に学習に取り組む態度" },
];
const PERSPECTIVE_COLOR = { 知: "#2B6E6E", 技: "#4A6FA5", 思: "#8A5A2B", 主: "#B5453D" };
const GRADES = ["1年", "2年", "3年", "4年", "5年", "6年", "その他"];
const WEEKDAY_KANJI = ["日", "月", "火", "水", "木", "金", "土"];

/* ============================================================
   ヘルパー関数
============================================================ */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function circled(n) {
  if (n < 1) return "";
  if (n <= 20) return String.fromCodePoint(0x2460 + n - 1);
  if (n <= 35) return String.fromCodePoint(0x3251 + n - 21);
  if (n <= 50) return String.fromCodePoint(0x32b1 + n - 36);
  return `(${n})`;
}
function pad(n) { return String(n).padStart(2, "0"); }
function toDateStr(dt) { return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`; }
function toMonday(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  return toDateStr(dt);
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return toDateStr(dt);
}
function formatWeekRange(monday) {
  const fri = addDays(monday, 4);
  const [y1, m1, d1] = monday.split("-");
  const [, m2, d2] = fri.split("-");
  return `${y1}年${Number(m1)}月${Number(d1)}日（月）〜${Number(m2)}月${Number(d2)}日（金）`;
}
/** 添付様式に合わせた見出し用の週範囲（月～日） */
function formatWeekRangeShort(monday) {
  const sunday = addDays(monday, 6);
  const [, m1, d1] = monday.split("-");
  const [, m2, d2] = sunday.split("-");
  return `${Number(m1)}月${Number(d1)}日　～　${Number(m2)}月${Number(d2)}日`;
}
function formatDayHeader(monday, dayIndex) {
  const dateStr = addDays(monday, dayIndex);
  const [, m, d] = dateStr.split("-");
  const dt = new Date(dateStr);
  return `${Number(m)}月${Number(d)}日(${WEEKDAY_KANJI[dt.getDay()]})`;
}
function emptyTimetable() {
  const t = {};
  ALL_DAYS.forEach((d) => { t[d.key] = {}; PERIOD_NUMS.forEach((p) => { t[d.key][p] = null; }); });
  return t;
}
const BREAK_LABELS = ROWS.filter((r) => r.type === "break").map((r) => r.label);
function emptyBreakNotes() {
  const b = {};
  ALL_DAYS.forEach((d) => {
    b[d.key] = {};
    BREAK_LABELS.forEach((label) => { b[d.key][label] = ""; });
  });
  return b;
}
function getBreakNote(week, day, label) {
  return week?.breakNotes?.[day]?.[label] || "";
}
function buildWeekFromTimetable(timetable) {
  const lessons = {};
  ALL_DAYS.forEach((d) => {
    lessons[d.key] = {};
    PERIOD_NUMS.forEach((p) => {
      const cls = timetable?.[d.key]?.[p] || null;
      lessons[d.key][p] = cls ? { class: cls, content: "", skip: false, skipReason: "" } : null;
    });
  });
  return { lessons, breakNotes: emptyBreakNotes(), reflection: "", goal: "", stamps: { principal: false, vice: false, tantou: false } };
}
function computeLessonNumbers(weeks) {
  const weekStarts = Object.keys(weeks).sort();
  const counters = {};
  const numbers = {};
  for (const ws of weekStarts) {
    const week = weeks[ws];
    numbers[ws] = {};
    for (const d of ALL_DAYS) {
      numbers[ws][d.key] = {};
      for (const p of PERIOD_NUMS) {
        const slot = week?.lessons?.[d.key]?.[p];
        if (slot && slot.class && !slot.skip) {
          counters[slot.class] = (counters[slot.class] || 0) + 1;
          numbers[ws][d.key][p] = counters[slot.class];
        }
      }
    }
  }
  return { numbers, maxByClass: counters };
}
function computeHoursByClassAndMonth(weeks) {
  const result = {};
  const monthsSet = new Set();
  Object.keys(weeks).forEach((ws) => {
    const week = weeks[ws];
    ALL_DAYS.forEach((d, dayIndex) => {
      PERIOD_NUMS.forEach((p) => {
        const slot = week?.lessons?.[d.key]?.[p];
        if (slot && slot.class && !slot.skip) {
          const dateStr = addDays(ws, dayIndex);
          const [y, m] = dateStr.split("-");
          const mk = `${y}-${m}`;
          monthsSet.add(mk);
          if (!result[slot.class]) result[slot.class] = {};
          result[slot.class][mk] = (result[slot.class][mk] || 0) + 1;
        }
      });
    });
  });
  const months = Array.from(monthsSet).sort();
  return { result, months };
}
function inferGrade(name) {
  const m = String(name).match(/^(\d+)\s*年/);
  return m ? `${m[1]}年` : "その他";
}
function classGrade(config, className) {
  const found = config.classes.find((c) => c.name === className);
  if (found) return found.grade;
  return inferGrade(className);
}
function computeMaxByGrade(config, maxByClass) {
  const result = {};
  config.classes.forEach((c) => {
    const m = maxByClass[c.name] || 0;
    result[c.grade] = Math.max(result[c.grade] || 0, m);
  });
  return result;
}
function migrateClasses(rawClasses) {
  let changed = false;
  const next = (rawClasses || []).map((c) => {
    if (typeof c === "string") {
      changed = true;
      const m = c.match(/^(\d+)\s*年/);
      const grade = m ? `${m[1]}年` : "その他";
      const rest = m ? c.slice(m[0].length).trim() : c;
      return { name: c, grade, suffix: rest || c };
    }
    return c;
  });
  return { next, changed };
}
function migrateObjectivesToGrades(config, objectives) {
  let changed = false;
  const next = { ...objectives };
  config.classes.forEach((cls) => {
    const key = cls.name;
    if (key === cls.grade) return;
    if (next[key] && typeof next[key] === "object") {
      const grade = cls.grade;
      const bucket = { ...(next[grade] || {}) };
      Object.keys(next[key]).forEach((k) => {
        if (k === "_meta") return;
        if (bucket[k] === undefined) { bucket[k] = next[key][k]; changed = true; }
      });
      if (next[key]._meta) {
        const curExtra = bucket._meta?.extra || 0;
        const oldExtra = next[key]._meta.extra || 0;
        bucket._meta = { extra: Math.max(curExtra, oldExtra) };
        changed = true;
      }
      next[grade] = bucket;
      delete next[key];
      changed = true;
    }
  });
  return { next, changed };
}
function todayStamp() {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}

/* ============================================================
   ファイルハンドルの記憶（IndexedDB）
   一度「保存」または「開く」で選んだファイルを覚えておき、
   次回開いたときに自動で再接続できるようにします（Chrome/Edge等）
============================================================ */
const IDB_NAME = "music-planner-db";
const IDB_STORE = "handles";
const IDB_KEY = "dataFile";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSetHandle(handle) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* このブラウザでは利用できません */ }
}
async function idbGetHandle() {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}

/* ============================================================
   ブラウザ内の一時保存（同じブラウザで再度開いたときの下書き復元用の予備）
============================================================ */
async function tryAutosaveLoad() {
  try {
    if (!window.storage) return null;
    const [c, w, o] = await Promise.all([
      window.storage.get("config", false),
      window.storage.get("weeks", false),
      window.storage.get("objectives", false),
    ]);
    return {
      config: c && c.value ? JSON.parse(c.value) : null,
      weeks: w && w.value ? JSON.parse(w.value) : null,
      objectives: o && o.value ? JSON.parse(o.value) : null,
    };
  } catch (e) { return null; }
}
function autosave() {
  if (!window.storage) return;
  try {
    window.storage.set("config", JSON.stringify(state.config), false);
    window.storage.set("weeks", JSON.stringify(state.weeks), false);
    window.storage.set("objectives", JSON.stringify(state.objectives), false);
  } catch (e) { /* 無視（このブラウザでは利用できません） */ }
}

/* ============================================================
   状態
============================================================ */
const state = {
  loading: true,
  tab: "weekly",
  config: { classes: [], timetable: emptyTimetable() },
  weeks: {},
  objectives: {},
  currentMonday: toMonday(toDateStr(new Date())),
  objGrade: null,
  ui: { newGrade: "1年", newSuffix: "", settingsDay: "mon", weekDay: "mon" },
  pendingHandle: null,
  pendingHandleName: "",
};
let dirty = false;
let lastSavedAt = null;
let fileHandle = null;
let autosaveTimer = null;
let saving = false;

function updateSaveStatusDom() {
  const el = document.getElementById("save-status-text");
  if (!el) return;
  let text;
  if (saving) text = "保存中…";
  else if (dirty) text = "未保存の変更があります";
  else if (fileHandle && lastSavedAt) text = `自動保存済み（${esc(fileHandle.name)}） ${pad(lastSavedAt.getHours())}:${pad(lastSavedAt.getMinutes())}`;
  else if (lastSavedAt) text = `最終保存：${pad(lastSavedAt.getHours())}:${pad(lastSavedAt.getMinutes())}`;
  else text = "ファイルからまだ保存していません";
  el.textContent = text;
  el.classList.toggle("dirty", dirty && !saving);
}
async function autoWriteToHandle() {
  if (!fileHandle) return;
  try {
    saving = true;
    updateSaveStatusDom();
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(snapshotData(), null, 2));
    await writable.close();
    dirty = false;
    lastSavedAt = new Date();
  } catch (e) {
    console.warn("自動保存に失敗しました", e);
  } finally {
    saving = false;
    updateSaveStatusDom();
  }
}
async function doAutosave() {
  autosave();
  if (fileHandle) await autoWriteToHandle();
  else updateSaveStatusDom();
}
function markDirty() {
  dirty = true;
  updateSaveStatusDom();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(doAutosave, 800);
}

window.addEventListener("beforeunload", (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

function ensureWeek() {
  if (!state.weeks[state.currentMonday]) {
    state.weeks[state.currentMonday] = buildWeekFromTimetable(state.config.timetable);
    markDirty();
  }
}

/* ============================================================
   ファイルへの保存・読み込み
============================================================ */
function snapshotData() {
  return { app: "music-weekly-planner", version: 1, savedAt: new Date().toISOString(), config: state.config, weeks: state.weeks, objectives: state.objectives };
}
async function saveToFile() {
  const data = JSON.stringify(snapshotData(), null, 2);
  if (window.showSaveFilePicker) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: "music-plan-data.json",
          types: [{ description: "週案データ (JSON)", accept: { "application/json": [".json"] } }],
        });
        idbSetHandle(fileHandle);
      }
      const writable = await fileHandle.createWritable();
      await writable.write(data);
      await writable.close();
      dirty = false;
      lastSavedAt = new Date();
      render();
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      console.warn("ファイル保存に失敗したため、ダウンロード形式で保存します", e);
    }
  }
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `music-plan-${todayStamp()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  dirty = false;
  lastSavedAt = new Date();
  render();
}
async function openFromFile() {
  if (dirty && !confirm("保存していない変更があります。読み込みを行うと上書きされます。続けますか？")) return;
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: [{ description: "週案データ (JSON)", accept: { "application/json": [".json"] } }] });
      fileHandle = handle;
      idbSetHandle(fileHandle);
      const file = await fileHandle.getFile();
      const text = await file.text();
      loadDataFromText(text);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      console.warn("ファイル選択に失敗したため、従来の方法を使用します", e);
    }
  }
  document.getElementById("file-input-fallback").click();
}
function loadDataFromText(text) {
  try {
    const parsed = JSON.parse(text);
    const { next: migratedClasses } = migrateClasses(parsed.config?.classes);
    state.config = { classes: migratedClasses, timetable: parsed.config?.timetable || emptyTimetable() };
    state.weeks = parsed.weeks || {};
    const { next: migratedObjectives } = migrateObjectivesToGrades(state.config, parsed.objectives || {});
    state.objectives = migratedObjectives;
    if (state.config.classes[0]) state.objGrade = state.config.classes[0].grade;
    dirty = false;
    lastSavedAt = new Date();
    ensureWeek();
    render();
  } catch (e) {
    alert("ファイルの読み込みに失敗しました。正しいバックアップファイル（.json）か確認してください。");
  }
}
document.getElementById("file-input-fallback").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadDataFromText(reader.result);
  reader.readAsText(file);
  e.target.value = "";
});
async function reconnectFile() {
  const handle = state.pendingHandle;
  if (!handle) return;
  try {
    const perm = await handle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") { alert("ファイルへのアクセスが許可されませんでした。"); return; }
    fileHandle = handle;
    state.pendingHandle = null;
    const file = await fileHandle.getFile();
    const text = await file.text();
    loadDataFromText(text);
  } catch (e) {
    alert("前回のファイルに接続できませんでした。「開く」から選び直してください。");
    state.pendingHandle = null;
    render();
  }
}

/* ============================================================
   初期化
============================================================ */
async function init() {
  let loadedFromFile = false;
  const savedHandle = await idbGetHandle();
  if (savedHandle) {
    try {
      const perm = await savedHandle.queryPermission({ mode: "readwrite" });
      if (perm === "granted") {
        fileHandle = savedHandle;
        const file = await fileHandle.getFile();
        const text = await file.text();
        const parsed = JSON.parse(text);
        const { next: migratedClasses } = migrateClasses(parsed.config?.classes);
        state.config = { classes: migratedClasses, timetable: parsed.config?.timetable || emptyTimetable() };
        state.weeks = parsed.weeks || {};
        const { next: migratedObjectives } = migrateObjectivesToGrades(state.config, parsed.objectives || {});
        state.objectives = migratedObjectives;
        lastSavedAt = new Date();
        loadedFromFile = true;
      } else {
        state.pendingHandle = savedHandle;
        state.pendingHandleName = savedHandle.name || "";
      }
    } catch (e) { /* 保存済みのファイル情報が無効な場合は無視 */ }
  }
  if (!loadedFromFile) {
    const auto = await tryAutosaveLoad();
    if (auto && (auto.config || auto.weeks || auto.objectives)) {
      const { next: migratedClasses } = migrateClasses(auto.config?.classes || []);
      state.config = { classes: migratedClasses, timetable: auto.config?.timetable || emptyTimetable() };
      state.weeks = auto.weeks || {};
      const { next: migratedObjectives } = migrateObjectivesToGrades(state.config, auto.objectives || {});
      state.objectives = migratedObjectives;
    }
  }
  state.loading = false;
  if (state.config.classes[0]) state.objGrade = state.config.classes[0].grade;
  ensureWeek();
  render();
}

/* ============================================================

============================================================ */
function render() {
  const app = document.getElementById("app");
  if (state.loading) {
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">読み込み中…</div>`;
    return;
  }
  ensureWeek();
  app.innerHTML = renderHeader() + `<main>${renderTabContent()}</main>`;
  updateSaveStatusDom();
  if (state.tab === "print") adjustPrintScale();
}
function adjustPrintScale() {
  const page = document.querySelector(".print-page");
  const wrapper = document.getElementById("print-wrapper");
  if (!page || !wrapper) return;
  const pxWidth = 793.7; // 210mm at 96dpi
  const pxHeight = 1122.5; // 297mm at 96dpi
  const available = wrapper.clientWidth;
  const scale = Math.min(1, available / pxWidth);
  page.style.transformOrigin = "top left";
  page.style.transform = `scale(${scale})`;
  wrapper.style.height = `${pxHeight * scale}px`;
}

function renderObjectivesTab() {
  const cfg = state.config;
  if (cfg.classes.length === 0) {
    return `<div class="card" style="color:var(--muted2);">「設定」タブで担当クラスを登録すると、ここにめあてを入力できます。</div>`;
  }
  const { maxByClass } = computeLessonNumbers(state.weeks);
  const maxByGrade = computeMaxByGrade(cfg, maxByClass);
  const gradesPresent = GRADES.filter((g) => cfg.classes.some((c) => c.grade === g));
  const grade = state.objGrade && gradesPresent.includes(state.objGrade) ? state.objGrade : gradesPresent[0];
  const classesInGrade = cfg.classes.filter((c) => c.grade === grade).map((c) => c.name);

  const known = Object.keys(state.objectives?.[grade] || {}).filter((k) => k !== "_meta").map(Number);
  const extra = state.objectives?.[grade]?._meta?.extra || 0;
  const maxNum = Math.max(maxByGrade[grade] || 0, known.length ? Math.max(...known) : 0);
  const displayCount = maxNum + 3 + extra;
  const rows = Array.from({ length: displayCount }, (_, i) => i + 1);

  const rowsHtml = rows
    .map((num) => {
      const o = state.objectives?.[grade]?.[num] || { perspective: "", text: "" };
      const isPlanned = num <= (maxByGrade[grade] || 0);
      return `
      <div class="obj-row ${isPlanned ? "" : "future"}">
        <div class="obj-num ${isPlanned ? "" : "future"}">${circled(num)}</div>
        <div style="display:flex;flex-direction:column;gap:6px;flex:1;">
          <select class="select" style="max-width:280px;" data-role="obj-perspective" data-num="${num}">
            <option value="">評価観点を選択</option>
            ${PERSPECTIVES.map((p) => `<option value="${p.key}" ${o.perspective === p.key ? "selected" : ""}>${p.label}</option>`).join("")}
          </select>
          <input class="input" placeholder="具体的なめあてを入力（例：拍の流れにのって強弱の変化を感じ取りながら演奏する）" value="${esc(o.text || "")}" data-role="obj-text" data-num="${num}" />
        </div>
        ${!isPlanned ? `<span style="font-size:11px;color:var(--muted2);white-space:nowrap;margin-top:8px;">未実施</span>` : ""}
      </div>`;
    })
    .join("");

  return `
  <div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
    <span style="font-size:14px;font-weight:600;">学年：</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${gradesPresent.map((g) => `<button class="pill-btn ${g === grade ? "active" : ""}" data-role="obj-grade" data-grade="${g}">${g}</button>`).join("")}
    </div>
  </div>

  <section class="card">
    <p class="hint">ここで入力しためあては、同じ学年に属するすべてのクラス（${esc(classesInGrade.join("、"))}）の週案に、回数が一致するコマへ自動的に表示されます。回数は週案に入力された授業から自動的に連動します。</p>
    <div style="display:flex;flex-direction:column;gap:10px;">${rowsHtml}</div>
    <div style="display:flex;justify-content:center;gap:10px;margin-top:14px;">
      <button class="btn btn-outline" data-role="obj-extra" data-delta="1">＋ 回を追加</button>
      ${extra > 0 ? `<button class="btn btn-muted" data-role="obj-extra" data-delta="-1">− 追加分を1つ減らす</button>` : ""}
    </div>
  </section>`;
}

/* ---------------- 時数タブ ---------------- */
function renderHoursTab() {
  const cfg = state.config;
  if (cfg.classes.length === 0) {
    return `<div class="card" style="color:var(--muted2);">「設定」タブで担当クラスを登録すると、時数を確認できます。</div>`;
  }
  const { maxByClass } = computeLessonNumbers(state.weeks);
  const { result, months } = computeHoursByClassAndMonth(state.weeks);
  if (months.length === 0) {
    return `<div class="card" style="color:var(--muted2);">まだ授業の記録がありません。週案タブで授業を入力すると、ここに時数が自動集計されます。</div>`;
  }
  const grouped = GRADES.map((g) => ({ grade: g, list: cfg.classes.filter((c) => c.grade === g) })).filter((g) => g.list.length > 0);

  const monthTotals = {};
  months.forEach((m) => { monthTotals[m] = 0; });
  let grandTotal = 0;

  const bodyRows = grouped
    .map((g) => {
      const gradeHeader = `<tr><td colspan="${months.length + 2}" style="background:var(--paper-dark);font-weight:700;font-size:12px;color:var(--accent);padding:5px 10px;">${esc(g.grade)}</td></tr>`;
      const gradeRows = g.list
        .map((c) => {
          const rowTotal = maxByClass[c.name] || 0;
          grandTotal += rowTotal;
          const cells = months
            .map((m) => {
              const v = result[c.name]?.[m] || 0;
              monthTotals[m] += v;
              return `<td style="text-align:center;">${v || ""}</td>`;
            })
            .join("");
          return `<tr><td style="padding:6px 10px;">${esc(c.name)}</td>${cells}<td style="text-align:center;font-weight:700;">${rowTotal}</td></tr>`;
        })
        .join("");
      return gradeHeader + gradeRows;
    })
    .join("");

  const totalRow = `<tr style="background:var(--paper-dark);font-weight:700;"><td style="padding:6px 10px;">合計</td>${months
    .map((m) => `<td style="text-align:center;">${monthTotals[m]}</td>`)
    .join("")}<td style="text-align:center;">${grandTotal}</td></tr>`;

  const monthHeaders = months
    .map((m) => {
      const [y, mm] = m.split("-");
      return `<th>${y}年${Number(mm)}月</th>`;
    })
    .join("");

  if (isNarrow()) {
    const cardsHtml = grouped
      .map(
        (g) => `
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 6px;">${esc(g.grade)}</div>
      ${g.list
        .map((c) => {
          const rowTotal = maxByClass[c.name] || 0;
          const monthList = months
            .map((m) => {
              const v = result[c.name]?.[m] || 0;
              const [y, mm] = m.split("-");
              return `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12.5px;"><span>${y}年${Number(mm)}月</span><span>${v || 0}回</span></div>`;
            })
            .join("");
          return `
          <div class="mobile-period-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-weight:700;">${esc(c.name)}</span>
              <span style="font-weight:700;color:var(--accent);">総計 ${rowTotal}回</span>
            </div>
            ${monthList}
          </div>`;
        })
        .join("")}`
      )
      .join("");
    const monthTotalList = months
      .map((m) => {
        const [y, mm] = m.split("-");
        return `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);font-size:12.5px;"><span>${y}年${Number(mm)}月</span><span>${monthTotals[m]}回</span></div>`;
      })
      .join("");
    return `
    <section class="card">
      <h2 class="section-title">時数集計</h2>
      <p class="hint">週案に入力された授業（「実施しない」にしたものは除く）をもとに、クラスごと・月ごとの実施時数を自動で集計します。</p>
      ${cardsHtml}
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 6px;">全クラス合計</div>
      <div class="mobile-period-card">
        <div style="font-weight:700;color:var(--accent);margin-bottom:6px;">総計 ${grandTotal}回</div>
        ${monthTotalList}
      </div>
    </section>`;
  }

  return `
  <section class="card" style="overflow-x:auto;">
    <h2 class="section-title">時数集計</h2>
    <p class="hint">週案に入力された授業（「実施しない」にしたものは除く）をもとに、クラスごと・月ごとの実施時数を自動で集計します。</p>
    <table class="grid" style="min-width:${300 + months.length * 70}px;">
      <thead><tr><th style="text-align:left;">クラス</th>${monthHeaders}<th>総計</th></tr></thead>
      <tbody>${bodyRows}${totalRow}</tbody>
    </table>
  </section>`;
}

/* ---------------- 印刷プレビュー タブ（添付様式に準拠・A4縦・行の高さ均一） ---------------- */
function renderPrintTab() {
  const cfg = state.config;
  const week = state.weeks[state.currentMonday] || buildWeekFromTimetable(cfg.timetable);
  const { numbers } = computeLessonNumbers(state.weeks);

  const bodyRows = ROWS.filter((row) => row.type !== "break" || row.label === "中休み").map((row) => {
    if (row.type === "break") {
      const cells = DAYS.map((d) => {
        const note = getBreakNote(week, d.key, row.label);
        return `<td class="print-break-cell">
          <div class="print-break-label">${esc(row.label)}</div>
          ${note ? `<div class="clamp2 print-break-note">${esc(note)}</div>` : ""}
        </td>`;
      }).join("");
      return `<tr><td class="print-break-cell print-row-label">${esc(row.label)}</td>${cells}</tr>`;
    }
    const p = row.num;
    const cells = DAYS.map((d) => {
      const slot = week.lessons?.[d.key]?.[p];
      if (!slot?.class) return `<td class="print-period-cell"></td>`;
      const num = numbers?.[state.currentMonday]?.[d.key]?.[p];
      const grade = classGrade(cfg, slot.class);
      const objText = state.objectives?.[grade]?.[num]?.text || "";
      const objPersp = state.objectives?.[grade]?.[num]?.perspective || "";
      return `<td class="print-period-cell">
        <div class="print-lesson-line1">${esc(slot.class)}　音楽${slot.skip ? `<span class="print-badge skip">実施なし</span>` : ""}</div>
        <div class="clamp2 print-lesson-line2">${esc(slot.content)}${num ? ` (${num})` : ""}</div>
        ${objText ? `<div class="clamp2 print-lesson-line3" style="color:${PERSPECTIVE_COLOR[objPersp] || "#333"};">${objPersp ? `${objPersp}　` : ""}${esc(objText)}</div>` : ""}
      </td>`;
    }).join("");
    return `<tr><td class="print-period-cell print-row-label">${p}</td>${cells}</tr>`;
  }).join("");

  return `
  <div class="print-toolbar no-print card">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="nav-btn" data-role="print-nav" data-delta="-7">‹</button>
      <span style="font-weight:700;">${formatWeekRange(state.currentMonday)}</span>
      <button class="nav-btn" data-role="print-nav" data-delta="7">›</button>
    </div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">
      「印刷 / PDF出力」を押すと印刷ダイアログが開きます。送信先で <strong>PDFに保存</strong> を選ぶとPDFとして保存できます。<br/>
      うまく開かない場合は、キーボードの <strong>Ctrl+P</strong>（Macは<strong>⌘+P</strong>）をお使いください。
    </div>
    <button class="btn btn-primary" data-role="do-print">🖶 印刷 / PDF出力</button>
  </div>

  <div class="print-page-wrapper" id="print-wrapper">
  <div class="print-page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2mm;">
      <div style="font-family:'Shippori Mincho', serif;font-size:15px;font-weight:700;">週案（予定・めあて）</div>
      <div style="display:flex;gap:3mm;">
        ${["校長印", "副校長印", "担当印"]
          .map((label) => `<div style="display:flex;flex-direction:column;align-items:center;gap:0.8mm;"><div class="print-hanko-box"></div><span style="font-size:8px;">${label}</span></div>`)
          .join("")}
      </div>
    </div>
    <div style="text-align:center;font-size:11px;margin-bottom:2mm;">${formatWeekRangeShort(state.currentMonday)}</div>

    <table>
      <colgroup><col style="width:6%;" />${DAYS.map(() => `<col style="width:${94 / DAYS.length}%;" />`).join("")}</colgroup>
      <thead><tr><th class="print-th"></th>${DAYS.map((d, i) => `<th class="print-th">${formatDayHeader(state.currentMonday, i)}</th>`).join("")}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:4mm;">
      <div class="print-goal-box">
        <div style="font-size:9px;font-weight:700;margin-bottom:1mm;">今週の目標</div>
        <div style="font-size:9px;white-space:pre-wrap;min-height:14mm;">${esc(week.goal)}</div>
      </div>
      <div class="print-goal-box">
        <div style="font-size:9px;font-weight:700;margin-bottom:1mm;">今週の振り返り</div>
        <div style="font-size:9px;white-space:pre-wrap;min-height:14mm;">${esc(week.reflection)}</div>
      </div>
    </div>
  </div>
  </div>`;
}

/* ============================================================
   イベント処理（イベント委任）
============================================================ */
function addClass() {
  const grade = state.ui.newGrade || "1年";
  const suffix = (state.ui.newSuffix || "").trim();
  if (!suffix) return;
  const name = `${grade}${suffix}`;
  if (state.config.classes.some((c) => c.name === name)) return;
  state.config.classes.push({ name, grade, suffix });
  state.ui.newSuffix = "";
  markDirty();
}
function applyTimetableToWeek() {
  const w = state.weeks[state.currentMonday] || buildWeekFromTimetable(state.config.timetable);
  const lessons = {};
  DAYS.forEach((d) => {
    lessons[d.key] = { ...w.lessons[d.key] };
    PERIOD_NUMS.forEach((p) => {
      const cls = state.config.timetable?.[d.key]?.[p] || null;
      const existing = lessons[d.key][p];
      if (cls && !existing) lessons[d.key][p] = { class: cls, content: "", skip: false, skipReason: "" };
    });
  });
  state.weeks[state.currentMonday] = { ...w, lessons };
  markDirty();
}

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-role]");
  if (!el) return;
  const role = el.dataset.role;
  if (role === "tab") { state.tab = el.dataset.tab; render(); }
  else if (role === "week-nav" || role === "print-nav") {
    state.currentMonday = addDays(state.currentMonday, Number(el.dataset.delta));
    ensureWeek();
    render();
  }
  else if (role === "stamp") {
    const w = state.weeks[state.currentMonday];
    w.stamps = { ...w.stamps, [el.dataset.key]: !w.stamps?.[el.dataset.key] };
    markDirty();
    render();
  }
  else if (role === "apply-timetable") { applyTimetableToWeek(); render(); }
  else if (role === "remove-class") {
    state.config.classes = state.config.classes.filter((c) => c.name !== el.dataset.name);
    markDirty();
    render();
  }
  else if (role === "add-class") { addClass(); render(); }
  else if (role === "obj-grade") { state.objGrade = el.dataset.grade; render(); }
  else if (role === "obj-extra") {
    const grade = state.objGrade;
    const curMeta = state.objectives?.[grade]?._meta || { extra: 0 };
    const nextExtra = Math.max(0, (curMeta.extra || 0) + Number(el.dataset.delta));
    state.objectives[grade] = { ...(state.objectives[grade] || {}), _meta: { ...curMeta, extra: nextExtra } };
    markDirty();
    render();
  }
  else if (role === "settings-day") { state.ui.settingsDay = el.dataset.day; render(); }
  else if (role === "week-day") { state.ui.weekDay = el.dataset.day; render(); }
  else if (role === "do-print") { window.print(); }
  else if (role === "save-file") { saveToFile(); }
  else if (role === "open-file") { openFromFile(); }
  else if (role === "reconnect-file") { reconnectFile(); }
});

document.getElementById("app").addEventListener("change", (e) => {
  const el = e.target.closest("[data-role]");
  if (el) {
    const role = el.dataset.role;
    if (role === "slot-class") {
      const day = el.dataset.day, period = el.dataset.period;
      const w = state.weeks[state.currentMonday];
      if (el.value) {
        const existing = w.lessons[day][period] || { content: "", skip: false, skipReason: "" };
        w.lessons[day][period] = { ...existing, class: el.value, skip: false };
      } else {
        w.lessons[day][period] = null;
      }
      markDirty();
      render();
      return;
    }
    if (role === "slot-skip") {
      const day = el.dataset.day, period = el.dataset.period;
      const w = state.weeks[state.currentMonday];
      w.lessons[day][period] = { ...w.lessons[day][period], skip: el.checked };
      markDirty();
      render();
      return;
    }
    if (role === "timetable-cell") {
      const day = el.dataset.day, period = el.dataset.period;
      state.config.timetable[day][period] = el.value || null;
      markDirty();
      render();
      return;
    }
    if (role === "obj-perspective") {
      const grade = state.objGrade;
      const num = el.dataset.num;
      const cur = state.objectives?.[grade]?.[num] || { perspective: "", text: "" };
      state.objectives[grade] = { ...(state.objectives[grade] || {}), [num]: { ...cur, perspective: el.value } };
      markDirty();
      return;
    }
  }
  if (e.target.id === "new-grade") { state.ui.newGrade = e.target.value; }
});

document.getElementById("app").addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "week-date-input") {
    state.currentMonday = toMonday(el.value);
    ensureWeek();
    render();
    return;
  }
  const role = el.dataset.role;
  if (role === "slot-content") {
    const day = el.dataset.day, period = el.dataset.period;
    const w = state.weeks[state.currentMonday];
    w.lessons[day][period] = { ...w.lessons[day][period], content: el.value };
    markDirty();
  }
  else if (role === "week-field") {
    const w = state.weeks[state.currentMonday];
    w[el.dataset.field] = el.value;
    markDirty();
  }
  else if (role === "break-note") {
    const day = el.dataset.day, label = el.dataset.label;
    const w = state.weeks[state.currentMonday];
    if (!w.breakNotes) w.breakNotes = emptyBreakNotes();
    if (!w.breakNotes[day]) w.breakNotes[day] = {};
    w.breakNotes[day][label] = el.value;
    markDirty();
  }
  else if (role === "obj-text") {
    const grade = state.objGrade;
    const num = el.dataset.num;
    const cur = state.objectives?.[grade]?.[num] || { perspective: "", text: "" };
    state.objectives[grade] = { ...(state.objectives[grade] || {}), [num]: { ...cur, text: el.value } };
    markDirty();
  }
  else if (role === "new-suffix") { state.ui.newSuffix = el.value; }
});

document.getElementById("app").addEventListener("keydown", (e) => {
  if (e.target.dataset && e.target.dataset.role === "new-suffix" && e.key === "Enter") {
    addClass();
    render();
  }
});

init();
</script>
</body>
</html>
